site_name: "flowgram"
site_description: "Presentation-quality diagrams from a short Python spec"
repo_url: https://github.com/Sandsy09/flowgram
repo_name: Sandsy09/flowgram
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

nav:
  - Home: index.md
  - User guide:
      - Concepts: guide/concepts.md
      - Layout: guide/layout.md
      - Edges: guide/edges.md
      - Themes: guide/themes.md
      - Export: guide/export.md
      - Loading specs: guide/loading.md
      - Jupyter and PowerPoint: guide/jupyter-and-powerpoint.md
      - Known limits: guide/limits.md
  - Gallery: gallery/index.md
  - Design:
      - MVP spec: design/spec.md
      - Roadmap: design/roadmap.md
  - API Reference: reference.md
  - Decisions:
      - Overview: adr/README.md
      - 0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
      - 0002 Frozen Pydantic spec models: adr/0002-frozen-pydantic-spec-models.md
      - 0003 Abstract units and layout-only containers: adr/0003-abstract-units-and-layout-only-containers.md
      - 0004 Layout results keyed by node path: adr/0004-layout-results-keyed-by-node-path.md
      - 0005 Keep the core in Python: adr/0005-keep-the-core-in-python.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
