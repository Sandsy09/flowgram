name: Compatibility

# The main CI matrix runs on Linux with locked, latest dependencies. This adds
# the macOS and Windows smoke test that the 0.1 definition of done asks for,
# and a run against the lowest versions pyproject.toml allows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Runs take about a minute. Without a limit a hung job holds for six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      - name: Test
        run: uv run poe test

  minimum:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.11"

      # Resolve every direct dependency (runtime and the test group) to the
      # lowest version its specifier allows, so a stale floor fails here.
      - name: Install lowest direct versions
        run: |
          uv venv --clear --python 3.11
          uv pip install --resolution lowest-direct --group test .
          uv pip list

      - name: Test
        run: .venv/bin/python -m pytest
