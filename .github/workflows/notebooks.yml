name: Notebooks

# Runs every tracked notebook from a clean copy and checks that none is
# committed with outputs or execution counts. Kept out of ci.yml, which is
# forge-owned.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  notebooks:
    name: Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      - name: Check notebooks
        run: uv run poe notebook:check
