name: Docs

# Publish the docs site to GitHub Pages from main. Pull requests only build
# the docs, in the CI workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; never cancel one that has started.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      - name: Build (warnings are errors)
        run: uv run poe docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
