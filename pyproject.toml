[project]
name = "flowgram"
version = "0.1.0"
description = "Presentation-quality diagrams from a short, typed Python spec, drawn with matplotlib"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sandsy09" },
]
keywords = [
    "diagram",
    "flowchart",
    "matplotlib",
    "pydantic",
    "presentation",
    "slides",
    "svg",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Matplotlib",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/Sandsy09/flowgram"
Documentation = "https://sandsy09.github.io/flowgram/"
Repository = "https://github.com/Sandsy09/flowgram"
Issues = "https://github.com/Sandsy09/flowgram/issues"
Changelog = "https://github.com/Sandsy09/flowgram/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flowgram"
module-root = "src"

# -----------------------------------------------------------------------------
# Dependency groups (PEP 735) -- not shipped to consumers
# -----------------------------------------------------------------------------

[dependency-groups]
lint = [
    "ruff>=0.14",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0.1",
]
typecheck = [
    "mypy>=1.14",
    "pyright>=1.1.390,<2",
    "ty>=0.0.95",
    "types-pyyaml>=6.0.12",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=1.0.7,<2",
    "git-cliff>=2.7,<3",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "docs" },
    "poethepoet>=0.31",
    "jupyterlab>=4.6,<5",
    "ipykernel>=7.3,<8",
    "nbclient>=0.11,<1",
    "nbformat>=5.11,<6",
    "pre-commit>=4,<5",
]

[tool.uv]
default-groups = ["dev"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
    "ANN",       # flake8-annotations
    "D",         # pydocstyle
]
ignore = [
    "D107",      # __init__ docstring - covered by the class docstring
    "ANN401",    # allow Any where deliberately used
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------
# Type checking
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

# -----------------------------------------------------------------------------
# Tests
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
# A hung test fails the run instead of blocking it. The thread method works on
# Windows too, and on a timeout it prints the stack of every thread, which names
# the test and the line it is stuck on.
timeout = 60
timeout_method = "thread"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Snapshot tests are opt-in: run them with `poe test:snapshots`.
    "-m",
    "not snapshot",
]
markers = [
    "snapshot: image snapshot test, Linux only (run with poe test:snapshots)",
]

# -----------------------------------------------------------------------------
# Tasks -- the single definition. Run via `uv run poe <task>`.
# -----------------------------------------------------------------------------

[tool.poe.tasks]
"lock:check" = "uv lock --check"
lint = "ruff check ."
format = "ruff format ."
"lint:fix" = "ruff check --fix ."
"format:check" = "ruff format --check ."
typecheck = "mypy ."
test = "pytest"
changelog = "git-cliff --output CHANGELOG.md"
coverage = "pytest --cov --cov-report=term-missing"
docs = "mkdocs serve"
"docs:build" = "mkdocs build --strict"
notebook = "jupyter lab"
"notebook:check" = "python scripts/check_notebooks.py"
gallery = "python scripts/build_gallery.py"
"powerpoint:pack" = "python scripts/powerpoint_pack.py"
"typecheck:pyright" = "pyright"
"test:snapshots" = "pytest -m snapshot"
"snapshots:update" = { cmd = "pytest -m snapshot", env = { FLOWGRAM_UPDATE_SNAPSHOTS = "1" } }
check = [
    "lock:check",
    "format:check",
    "lint",
    "typecheck",
    "test",
    "coverage",
    "notebook:check",
    "typecheck:pyright",
]
