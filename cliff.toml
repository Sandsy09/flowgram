# git-cliff configuration. The body below is a Tera template (git-cliff's
# engine), not Jinja -- `{{ ... }}` is evaluated by git-cliff at changelog
# generation time.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated by git-cliff from Conventional Commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# Only final release tags count. Pre-release tags (rc, a, b) are not
# releases here, so their commits are listed under the final release that
# follows them, in this file and in the GitHub Release notes.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
# Groups sort by name, so each starts with a hidden comment that sets its
# place; the template strips it.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^(chore|build|ci)", skip = true },
]
